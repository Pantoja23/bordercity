<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BCH | Master Admin Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --accent: #ffcc33; --bg: #05070a;
            --card: rgba(30, 35, 45, 0.9); --success: #10b981; --warning: #f97316;
        }

        body { margin: 0; font-family: 'Rajdhani', sans-serif; background: var(--bg); color: white; min-height: 100vh; overflow-x: hidden; }
        
        /* PANTALLA DE LOGIN */
        #login-section {
            max-width: 400px; margin: 100px auto; padding: 30px; 
            background: var(--card); border-radius: 20px; text-align: center; 
            border: 1px solid var(--primary); box-shadow: 0 0 20px rgba(0, 210, 255, 0.2);
        }
        
        header {
            padding: 15px 20px; background: rgba(0,0,0,0.8); border-bottom: 2px solid var(--primary);
            display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100;
        }

        .logo-text { font-family: 'Orbitron'; font-size: 1rem; color: var(--primary); letter-spacing: 2px; }

        .container { padding: 15px; max-width: 800px; margin: auto; }

        input, select {
            width: 100%; padding: 12px; margin: 10px 0; border-radius: 8px; 
            background: #111; color: white; border: 1px solid #333; box-sizing: border-box; font-size: 16px;
        }

        .btn-main {
            width: 100%; padding: 15px; background: var(--primary); border: none; 
            border-radius: 8px; font-family: 'Orbitron'; font-weight: bold; cursor: pointer; color: black;
        }

        /* ROWS ESTILO APP */
        .job-row { 
            background: var(--card); border-radius: 12px; padding: 15px; margin-bottom: 12px; 
            border-left: 5px solid var(--warning); cursor: pointer; transition: 0.2s;
        }
        .job-row.active { border-left-color: var(--success); }

        /* CAPA DE DETALLE (FULL SCREEN MOBILE) */
        #detail-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000; overflow-y: auto; padding: 20px; box-sizing: border-box;
        }

        .back-btn { background: none; border: none; color: var(--primary); font-family: 'Orbitron'; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div id="login-screen"> 
        <div id="login-section">
            <h2 style="font-family:'Orbitron'; color:var(--primary);">BCH ADMIN</h2>
            <input type="text" id="user-id" placeholder="USER ID">
            <input type="password" id="user-pass" placeholder="PASSWORD">
            <button class="btn-main" onclick="attemptLogin()">ACCESS SYSTEM</button>
        </div>
    </div>

    <div id="main-dashboard" style="display:none;">
        <header>
    <div class="logo-text">BCH MASTER</div>
    <div style="display: flex; align-items: center; gap: 10px;">
        <div id="user-welcome" style="font-size: 0.7rem; color: var(--accent);"></div>
        <button onclick="logout()" style="background: none; border: 1px solid #ff4444; color: #ff4444; font-size: 0.6rem; padding: 2px 5px; cursor: pointer; border-radius: 4px; font-family: 'Orbitron';">EXIT</button>
    </div>
</header>

        <div class="container">
            <h2 style="font-family: 'Orbitron'; font-size: 1.1rem; border-bottom: 1px solid #333; padding-bottom: 10px;">WORK ORDERS</h2>
            <div id="jobs-container"></div>
        </div>
    </div>

    <div id="map-container" style="width: 100%; height: 300px; border-radius: 15px; border: 1px solid var(--primary); margin-bottom: 20px; overflow: hidden;">
    <iframe id="google-map" width="100%" height="100%" frameborder="0" style="border:0" allowfullscreen></iframe>
</div>

    <div id="detail-overlay">
        <button class="back-btn" onclick="closeDetail()">← BACK TO LIST</button>
        <div id="detail-content"></div>
    </div>

    <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyFpsgp5rCOBNJfFDtQcQcZJLR3YNrp8qR5DDzvSrimHiwKnrYsSWrtCmYpL9xHKV32NQ/exec'; // <--- ASEGÚRATE QUE SEA LA /exec ACTUAL
    let sessionUser = null;
    let isDetailOpen = false;

    // --- 1. AUTO-LOGIN (AL CARGAR) ---
    window.onload = async () => {
        const savedUser = localStorage.getItem('bch_admin_session');
        if (savedUser) {
            sessionUser = JSON.parse(savedUser);
            showDashboard();
        }
    };
        

    // --- 2. LOGIN MANUAL ---
    async function attemptLogin() {
        const user = document.getElementById('user-id').value;
        const pass = document.getElementById('user-pass').value;
        const btn = document.querySelector('#login-section .btn-main');
        
        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;

        try {
            const res = await fetch(`${URL_SCRIPT}?action=login_staff&user=${user}&pass=${pass}`);
            const data = await res.json();
            
            if(data.success && (data.rol === 'ADMIN' || data.rol === 'LANDLORD')) {
                sessionUser = data;
                localStorage.setItem('bch_admin_session', JSON.stringify(data)); // GUARDAR SESIÓN
                showDashboard();
            } else { 
                alert("ACCESS DENIED: Credentials invalid or insufficient permissions."); 
                btn.innerText = "ACCESS SYSTEM";
                btn.disabled = false;
            }
        } catch (e) { 
            alert("CONNECTION ERROR: Check Script URL or Internet."); 
            btn.innerText = "ACCESS SYSTEM";
            btn.disabled = false;
        }
    }

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        document.getElementById('user-welcome').innerText = sessionUser.name.toUpperCase();
        loadJobs();
    }
        

    function logout() {
        if(confirm("¿Deseas cerrar sesión del sistema master?")) {
            localStorage.removeItem('bch_admin_session');
            location.reload();
        }
    }

    // --- 3. CARGA DE TRABAJOS Y DETALLES (MANTENIENDO TU FLOW) ---
    async function loadJobs() {
        if (!sessionUser) return;
        const container = document.getElementById('jobs-container');
        try {
            const res = await fetch(`${URL_SCRIPT}?action=get_jobs&rol=${sessionUser.rol}&name=${sessionUser.name}`);
            const jobs = await res.json();
            
            container.innerHTML = jobs.map(j => `
                <div class="job-row ${j.status === 'ACTIVE' ? 'active' : ''}" onclick='openDetail(${JSON.stringify(j)})'>
                    <div style="display:flex; justify-content:space-between; font-size:0.8rem;">
                        <span style="color:var(--primary);">#${j.id}</span>
                        <span style="color:${j.status === 'ON APPROVAL' ? 'var(--accent)' : 'var(--success)'}">${j.status}</span>
                    </div>
                    <h3 style="margin:10px 0 5px 0; font-size:1.1rem;">${j.direccion}</h3>
                    <p style="margin:0; font-size:0.9rem; color:#aaa;">${j.servicio}</p>
                </div>
            `).join('');
        } catch (e) { console.log("Error loading jobs"); }
    }

    function openDetail(j) {
        isDetailOpen = true; 
        document.getElementById('detail-overlay').style.display = 'block';
        const content = document.getElementById('detail-content');
        
        content.innerHTML = `
            <h2 style="color:var(--primary); font-family:'Orbitron';">Order #${j.id}</h2>
    
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:20px;">
        <p><b style="color:var(--primary)">Client:</b> ${j.cliente}</p>
        <p><b style="color:var(--primary)">Address:</b> ${j.direccion}</p>
        <p><b style="color:var(--primary)">Request:</b> ${j.servicio}</p>
    </div>

    <div style="margin-bottom:20px;">
        <label style="color:var(--accent); font-family:'Orbitron'; font-size:0.8rem; letter-spacing:1px;">PROBLEM DESCRIPTION / NOTAS:</label>
        <div style="background:#000; color:#0f0; font-family:monospace; padding:15px; border:1px solid #333; border-radius:5px; margin-top:5px; line-height:1.4;">
            > ${j.notas || "No detailed notes provided."}
        </div>
    </div>

    ${j.status === 'ON APPROVAL' ? `
        <button class="btn-main" onclick="authorizeJob('${j.id}')">ACTIVATE FOR INSPECTION</button>
    ` : `
        <div style="color:var(--success); text-align:center; padding:15px; border:1px solid var(--success); border-radius:10px; background:rgba(16,185,129,0.1);">
            <b style="font-family:'Orbitron';">✓ ORDER ACTIVE</b><br>
            <small>Tech Assigned: ${j.asignado_a || 'Pending'}</small>
        </div>
    `}
`;
    }

    function closeDetail() {
        isDetailOpen = false;
        document.getElementById('detail-overlay').style.display = 'none';
        loadJobs();
    }

    async function authorizeJob(id) {
        if(!confirm("¿Aprobar orden para inspección inmediata?")) return;
        const btn = event.target;
        btn.innerText = "ACTIVATING..."; btn.disabled = true;

        const formData = new FormData();
        formData.append('action', 'authorize');
        formData.append('id', id);
        formData.append('autorizado_por', sessionUser.name);

        try {
            const res = await fetch(URL_SCRIPT, { method: 'POST', body: formData });
            const result = await res.json();
            if(result.success) {
                alert("Order Activated!");
                closeDetail();
            }
        } catch(e) { alert("Error."); btn.disabled = false; btn.innerText = "ACTIVATE"; }
    }

    // Refresco cada 30 segundos si no hay detalle abierto
    setInterval(() => { if (!isDetailOpen && sessionUser) loadJobs(); }, 30000);
</script>
</body>
</html>
