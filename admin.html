<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aldo Properties | Admin Command Center</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d2ff; 
            --accent: #ffcc33; 
            --bg: #030508;
            --card: rgba(255, 255, 255, 0.03);
            --border: rgba(0, 210, 255, 0.2);
            --success: #00ff88;
            --warning: #ffaa00;
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body { 
            margin: 0; 
            font-family: 'Rajdhani', sans-serif; 
            background: radial-gradient(circle at top right, #0a111a, var(--bg)); 
            color: white; 
            min-height: 100vh;
        }

        /* LOGIN NATIVO */
        #login-screen {
            display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px;
        }
        #login-section {
            width: 100%; max-width: 400px; padding: 40px;
            background: var(--card); border-radius: 25px; 
            backdrop-filter: blur(15px); border: 1px solid var(--border);
            box-shadow: 0 10px 40px rgba(0,0,0,0.5); text-align: center;
        }

        /* HEADER PREMIUM */
        header {
            padding: 15px 5%; background: rgba(3, 5, 8, 0.9);
            border-bottom: 1px solid var(--border); backdrop-filter: blur(10px);
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-family: 'Orbitron'; font-size: 1.1rem; color: var(--primary); letter-spacing: 2px; font-weight: 700; }

        .container { padding: 20px 5%; max-width: 1200px; margin: auto; }

        /* INPUTS ESTILO APP */
        input, select {
            width: 100%; padding: 15px; margin: 10px 0; border-radius: 12px;
            background: rgba(255,255,255,0.05); color: white; border: 1px solid #333;
            font-family: 'Rajdhani'; outline: none; font-size: 1rem;
        }
        input:focus { border-color: var(--primary); }

        .btn-main {
            width: 100%; padding: 16px; background: var(--primary); border: none;
            border-radius: 12px; font-family: 'Orbitron'; font-weight: bold; 
            cursor: pointer; color: black; text-transform: uppercase; transition: 0.3s;
        }
        .btn-main:active { transform: scale(0.96); }

        /* GRID DE TRABAJOS */
        .jobs-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px;
        }

        .job-card {
            background: var(--card); border-radius: 20px; padding: 20px;
            border: 1px solid var(--border); transition: 0.3s; position: relative;
            overflow: hidden;
        }
        .job-card::before {
            content: ''; position: absolute; left: 0; top: 0; width: 4px; height: 100%;
            background: var(--warning);
        }
        .job-card.active::before { background: var(--success); }
        .job-card:hover { transform: translateY(-5px); background: rgba(255,255,255,0.06); }

        /* OVERLAY DE DETALLE NATIVO */
        #detail-overlay {
            display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg); z-index: 1000; overflow-y: auto; padding: 25px;
        }
        .back-btn { 
            background: none; border: 1px solid var(--primary); color: var(--primary); 
            padding: 8px 15px; border-radius: 8px; font-family: 'Orbitron'; cursor: pointer; margin-bottom: 25px;
        }

        .status-badge {
            font-size: 0.7rem; padding: 4px 10px; border-radius: 20px; font-family: 'Orbitron';
        }

        @media (max-width: 600px) {
            header { padding: 15px 20px; }
            .logo-text { font-size: 0.9rem; }
            .job-card { padding: 15px; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div id="login-section">
            <h1 style="font-family:'Orbitron'; color:var(--primary); font-size: 1.5rem; margin-bottom: 30px;">ALDO PROPERTIES<br><span style="color:white; font-size: 0.8rem;">ADMIN PORTAL</span></h1>
            <input type="text" id="user-id" placeholder="USERNAME">
            <input type="password" id="user-pass" placeholder="PASSWORD">
            <button class="btn-main" onclick="attemptLogin()">ENTER SYSTEM</button>
            <p style="font-size: 0.7rem; color: #555; margin-top: 20px;">SECURE ACCESS ONLY</p>
        </div>
    </div>

    <div id="main-dashboard" style="display:none;">
        <header>
            <div class="logo-text">ALDO PROPERTIES ADMIN</div>
            <div style="display: flex; align-items: center; gap: 15px;">
                <div id="user-welcome" style="font-size: 0.8rem; color: var(--accent); font-family: 'Orbitron';"></div>
                <button onclick="logout()" style="background: none; border: 1px solid #ff4444; color: #ff4444; font-size: 0.7rem; padding: 5px 10px; cursor: pointer; border-radius: 8px; font-family: 'Orbitron';">LOGOUT</button>
            </div>
        </header>

        <div class="container">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px;">
                <h2 style="font-family: 'Orbitron'; font-size: 1.2rem; margin:0;">MAINTENANCE TICKETS</h2>
                <button onclick="loadJobs()" style="background:none; border:none; color:var(--primary); font-size: 1.2rem;"><i class="fas fa-sync-alt"></i></button>
            </div>
            
            <div id="jobs-container" class="jobs-grid">
                </div>
        </div>
    </div>

    <div id="detail-overlay">
        <div style="max-width: 600px; margin: auto;">
            <button class="back-btn" onclick="closeDetail()"><i class="fas fa-arrow-left"></i> BACK</button>
            <div id="detail-content"></div>
        </div>
    </div>

    <script>
    const URL_SCRIPT = 'https://script.google.com/macros/s/AKfycbyFpsgp5rCOBNJfFDtQcQcZJLR3YNrp8qR5DDzvSrimHiwKnrYsSWrtCmYpL9xHKV32NQ/exec'; 
    let sessionUser = null;
    let isDetailOpen = false;

    window.onload = async () => {
        const savedUser = localStorage.getItem('aldo_admin_session');
        if (savedUser) {
            sessionUser = JSON.parse(savedUser);
            showDashboard();
        }
    };

    async function attemptLogin() {
        const user = document.getElementById('user-id').value;
        const pass = document.getElementById('user-pass').value;
        const btn = document.querySelector('#login-section .btn-main');
        
        btn.innerText = "AUTHENTICATING...";
        btn.disabled = true;

        try {
            const res = await fetch(`${URL_SCRIPT}?action=login_staff&user=${user}&pass=${pass}`);
            const data = await res.json();
            
            if(data.success && (data.rol === 'ADMIN' || data.rol === 'LANDLORD')) {
                sessionUser = data;
                localStorage.setItem('aldo_admin_session', JSON.stringify(data));
                showDashboard();
            } else { 
                alert("ACCESS DENIED"); 
                btn.innerText = "ENTER SYSTEM";
                btn.disabled = false;
            }
        } catch (e) { 
            alert("SERVER ERROR"); 
            btn.innerText = "ENTER SYSTEM";
            btn.disabled = false;
        }
    }

    function showDashboard() {
        document.getElementById('login-screen').style.display = 'none';
        document.getElementById('main-dashboard').style.display = 'block';
        document.getElementById('user-welcome').innerText = sessionUser.name.split(' ')[0].toUpperCase();
        loadJobs();
    }

    function logout() {
        if(confirm("Close Admin Session?")) {
            localStorage.removeItem('aldo_admin_session');
            location.reload();
        }
    }

    async function loadJobs() {
        if (!sessionUser) return;
        const container = document.getElementById('jobs-container');
        container.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>SCANNING NETWORK...</p>";

        try {
            const res = await fetch(`${URL_SCRIPT}?action=get_jobs&rol=${sessionUser.rol}&name=${sessionUser.name}`);
            const jobs = await res.json();
            
            container.innerHTML = jobs.map(j => `
                <div class="job-card ${j.status === 'ACTIVE' ? 'active' : ''}" onclick='openDetail(${JSON.stringify(j)})'>
                    <div style="display:flex; justify-content:space-between; align-items:flex-start;">
                        <span style="color:var(--primary); font-family:'Orbitron'; font-size:0.8rem;">#${j.id}</span>
                        <span class="status-badge" style="background:${j.status === 'ON APPROVAL' ? 'rgba(255,170,0,0.1)' : 'rgba(0,255,136,0.1)'}; color:${j.status === 'ON APPROVAL' ? 'var(--warning)' : 'var(--success)'}">
                            ${j.status}
                        </span>
                    </div>
                    <h3 style="margin:15px 0 5px 0; font-family:'Orbitron'; font-size:1rem; line-height:1.2;">${j.direccion}</h3>
                    <p style="margin:0; font-size:0.9rem; color:#888;"><i class="fas fa-tools"></i> ${j.servicio}</p>
                    <div style="margin-top:15px; font-size:0.7rem; color:#555; text-align:right;">TAP TO MANAGE</div>
                </div>
            `).join('');
        } catch (e) { container.innerHTML = "Error loading data."; }
    }

    function openDetail(j) {
        isDetailOpen = true; 
        document.getElementById('detail-overlay').style.display = 'block';
        const content = document.getElementById('detail-content');
        
        content.innerHTML = `
            <h2 style="color:var(--primary); font-family:'Orbitron'; margin-bottom:5px;">ORDER #${j.id}</h2>
            <p style="margin:0 0 25px 0; color:var(--accent); font-family:'Orbitron'; font-size:0.8rem;">MASTER CONTROL UNIT</p>

            <div style="background:var(--card); padding:20px; border-radius:15px; border:1px solid var(--border); margin-bottom:20px;">
                <p style="margin:10px 0;"><b style="color:var(--primary); font-family:'Orbitron'; font-size:0.7rem;">CLIENT:</b><br> ${j.cliente}</p>
                <p style="margin:10px 0;"><b style="color:var(--primary); font-family:'Orbitron'; font-size:0.7rem;">LOCATION:</b><br> ${j.direccion}</p>
                <p style="margin:10px 0;"><b style="color:var(--primary); font-family:'Orbitron'; font-size:0.7rem;">TASK:</b><br> ${j.servicio}</p>
            </div>

            <div style="margin-bottom:25px;">
                <label style="color:var(--accent); font-family:'Orbitron'; font-size:0.8rem;">SYSTEM NOTES:</label>
                <div style="background:#000; color:#0f0; font-family:monospace; padding:15px; border:1px solid #333; border-radius:10px; margin-top:10px; font-size:0.9rem;">
                    > ${j.notas || "No special instructions."}
                </div>
            </div>

            ${j.status === 'ON APPROVAL' ? `
                <button class="btn-main" onclick="authorizeJob('${j.id}')">APPROVE & DEPLOY TECH</button>
            ` : `
                <div style="color:var(--success); text-align:center; padding:20px; border:1px solid var(--success); border-radius:15px; background:rgba(0,255,136,0.05);">
                    <i class="fas fa-check-circle" style="font-size:2rem; margin-bottom:10px;"></i><br>
                    <b style="font-family:'Orbitron';">TICKET DEPLOYED</b><br>
                    <small>Assigned to: ${j.asignado_a || 'Network Dispatch'}</small>
                </div>
            `}
        `;
    }

    function closeDetail() {
        isDetailOpen = false;
        document.getElementById('detail-overlay').style.display = 'none';
        loadJobs();
    }

    async function authorizeJob(id) {
        if(!confirm("Authorize this ticket for immediate dispatch?")) return;
        const btn = event.target;
        btn.innerText = "DEPLOYING..."; btn.disabled = true;

        const formData = new FormData();
        formData.append('action', 'authorize');
        formData.append('id', id);
        formData.append('autorizado_por', sessionUser.name);

        try {
            const res = await fetch(URL_SCRIPT, { method: 'POST', body: formData });
            const result = await res.json();
            if(result.success) {
                alert("Unit Deployed Successfully!");
                closeDetail();
            }
        } catch(e) { alert("Deployment Error."); btn.disabled = false; btn.innerText = "APPROVE"; }
    }

    setInterval(() => { if (!isDetailOpen && sessionUser) loadJobs(); }, 30000);
</script>
</body>
</html>
