<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Aldo Properties | Tenant Concierge</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d2ff;
            --gold: #ffcc33;
            --bg: #030508;
            --glass: rgba(15, 20, 25, 0.9);
            --border: rgba(0, 210, 255, 0.2);
        }

        * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #0a111a 0%, #030508 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        /* Fondo Animado Sutil */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('https://www.transparenttextures.com/patterns/carbon-fibre.png');
            opacity: 0.1;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 480px;
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            border-radius: 30px;
            padding: 40px 25px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8);
            text-align: center;
        }

        .logo-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 4px;
            color: var(--primary);
            margin-bottom: 5px;
            text-shadow: 0 0 15px rgba(0,210,255,0.3);
        }

        .tenant-card {
            background: rgba(255, 204, 51, 0.05);
            border-radius: 20px;
            padding: 20px;
            margin: 25px 0;
            border-left: 4px solid var(--gold);
            text-align: left;
        }

        /* Esto arregla el contraste del drop box */
select option {
    background-color: #1a1d21; /* Fondo oscuro sólido */
    color: white;              /* Texto blanco */
    padding: 10px;
}

/* Estilo específico para el select cuando está cerrado */
select {
    width: 100%;
    background: rgba(255,255,255,0.03);
    border: 1px solid #333;
    padding: 15px 15px 15px 45px;
    border-radius: 15px;
    color: white;
    font-family: 'Rajdhani', sans-serif;
    font-size: 1.1rem;
    outline: none;
    appearance: none; /* Quita el estilo nativo para mejor control */
    -webkit-appearance: none;
    -moz-appearance: none;
}

/* Añadimos una flechita personalizada porque al quitar el appearance desaparece */
.input-group:has(select)::after {
    content: '\f107';
    font-family: 'Font Awesome 6 Free';
    font-weight: 900;
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    color: var(--primary);
    pointer-events: none;
}

        .input-group {
            margin-bottom: 15px;
            position: relative;
        }

        .input-group i {
            position: absolute;
            left: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--primary);
            font-size: 1.1rem;
        }

        input, select, textarea {
            width: 100%;
            background: rgba(255,255,255,0.03);
            border: 1px solid #333;
            padding: 15px 15px 15px 45px;
            border-radius: 15px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.1rem;
            outline: none;
            transition: 0.3s;
        }

        textarea { padding-left: 15px; height: 100px; resize: none; }

        input:focus, select:focus, textarea:focus {
            border-color: var(--primary);
            background: rgba(0,210,255,0.05);
            box-shadow: 0 0 10px rgba(0,210,255,0.1);
        }

        .btn-glow {
            width: 100%;
            padding: 20px;
            background: linear-gradient(45deg, #00d2ff, #0055ff);
            border: none;
            border-radius: 15px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(0,85,255,0.3);
            margin-top: 10px;
            transition: 0.3s;
        }

        .btn-glow:active { transform: scale(0.97); }

        .emergency-box {
            margin-top: 35px;
            padding-top: 25px;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .emergency-box a {
            color: var(--gold);
            text-decoration: none;
            font-size: 1.6rem;
            font-family: 'Orbitron';
            display: block;
            margin-top: 10px;
            font-weight: 700;
        }

        /* Estilo para los Labels de idioma */
        .lang-switch {
            font-size: 0.7rem;
            color: #555;
            margin-top: 10px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-font">ALDO PROPERTIES</div>
    <div style="font-family: 'Orbitron'; font-size: 0.7rem; color: #888; letter-spacing: 3px; margin-bottom: 10px;">MAINTENANCE PORTAL</div>
    
    <div class="tenant-card">
        <strong id="lbl-info-head" style="color: var(--gold); font-family: 'Orbitron'; font-size: 0.8rem;">CONCIERGE MSG:</strong><br>
        <span id="json-text" style="font-size: 0.95rem; line-height: 1.4;">Welcome. How can we assist you today?</span>
    </div>

    <form id="orderForm">
        <div class="input-group">
            <i class="fas fa-user"></i>
            <input type="text" name="Cliente" id="f-name" placeholder="FULL NAME" required>
        </div>

        <div class="input-group">
            <i class="fas fa-phone"></i>
            <input type="tel" id="telMask" name="Telefono" placeholder="PHONE NUMBER" maxlength="14" required>
        </div>

        <div class="input-group">
            <i class="fas fa-envelope"></i>
            <input type="email" id="emailInput" name="Email" placeholder="EMAIL ADDRESS" required>
        </div>

        <div class="input-group">
            <i class="fas fa-home"></i>
            <input type="text" name="Direccion" id="f-address" placeholder="PROPERTY ADDRESS" required>
        </div>

        <div class="input-group">
    <i class="fas fa-cog"></i>
    <select name="Servicio" id="f-service" required>
        <option value="" disabled selected id="opt-service" style="color: #888;">SELECT SERVICE TYPE</option>
        <option value="HVAC">AIR CONDITIONING / HEATING</option>
        <option value="Plumbing">PLUMBING</option>
        <option value="Electric">ELECTRICAL</option>
        <option value="Appliance">APPLIANCE REPAIR</option>
        <option value="Roofing/Leaks">ROOFING / LEAKS</option>
        <option value="Other">OTHER ISSUES</option>
    </select>
</div>

        <div class="input-group">
            <textarea name="Mensaje" id="f-msg" placeholder="DETAILED DESCRIPTION OF THE ISSUE"></textarea>
        </div>
        
        <button type="submit" id="btn-submit" class="btn-glow">DEPLOY REQUEST</button>
    </form>

    <div class="emergency-box">
        <span id="lbl-emergency" style="font-size: 0.9rem; color: #aaa;">24/7 EMERGENCY LINE:</span>
        <a href="tel:9152828490">(915) 282-8490</a>
    </div>

    <div class="lang-switch" id="lang-tag">Detecting locale...</div>
</div>

<script>
    // --- LÓGICA BILINGÜE AVANZADA ---
    const i18n = {
        es: {
            infoHead: "MSJ CONSERJERÍA:",
            welcome: "Bienvenido. ¿En qué podemos ayudarle hoy?",
            name: "NOMBRE COMPLETO",
            phone: "TELÉFONO (10 DÍGITOS)",
            email: "CORREO ELECTRÓNICO",
            address: "DIRECCIÓN DE LA PROPIEDAD",
            service: "TIPO DE SERVICIO",
            msg: "DESCRIPCIÓN DETALLADA DEL PROBLEMA",
            btn: "ENVIAR SOLICITUD",
            btnWait: "SISTEMA DESPLEGANDO...",
            emergency: "LÍNEA DE EMERGENCIAS 24/7:",
            tag: "MODO: ESPAÑOL"
        },
        en: {
            infoHead: "CONCIERGE MSG:",
            welcome: "Welcome. How can we assist you today?",
            name: "FULL NAME",
            phone: "PHONE NUMBER (10 DIGITS)",
            email: "EMAIL ADDRESS",
            address: "PROPERTY ADDRESS",
            service: "SELECT SERVICE TYPE",
            msg: "DETAILED DESCRIPTION OF THE ISSUE",
            btn: "DEPLOY REQUEST",
            btnWait: "SYSTEM DEPLOYING...",
            emergency: "24/7 EMERGENCY LINE:",
            tag: "MODE: ENGLISH"
        }
    };

    const userLang = (navigator.language || navigator.userLanguage).startsWith('es') ? 'es' : 'en';
    const t = i18n[userLang];

    // Aplicar traducción
    document.getElementById('lbl-info-head').innerText = t.infoHead;
    document.getElementById('json-text').innerText = t.welcome;
    document.getElementById('f-name').placeholder = t.name;
    document.getElementById('telMask').placeholder = t.phone;
    document.getElementById('emailInput').placeholder = t.email;
    document.getElementById('f-address').placeholder = t.address;
    document.getElementById('opt-service').innerText = t.service;
    document.getElementById('f-msg').placeholder = t.msg;
    document.getElementById('btn-submit').innerText = t.btn;
    document.getElementById('lbl-emergency').innerText = t.emergency;
    document.getElementById('lang-tag').innerText = t.tag;

    // Máscara de teléfono
    const telInput = document.getElementById('telMask');
    telInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, ''); 
        let x = value.match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    // Envío de datos
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.innerText = t.btnWait;
        btn.disabled = true;

        const scriptURL = 'https://script.google.com/macros/s/AKfycbxmPQHQn1Sw-If4NtWr_XadibpLWod7pRP6KOOKwJN1CWBYOMXXHaFxIHVW74N-4Sqjkw/exec';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: new FormData(this)
        })
        .then(() => {
            window.location.href = 'confirmation.html'; 
        })
        .catch(error => {
            alert("Network Error. Please try again.");
            btn.disabled = false;
            btn.innerText = t.btn;
        });
    });
</script>

</body>
</html>
