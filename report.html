<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <title>Border City Homes | Intelligence Hub</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --accent: #00d2ff;
            --gold: #ffcc33; /* Oro más brillante para mejor contraste */
            --glass: rgba(10, 15, 20, 0.85); /* Fondo más oscuro para que se lea mejor en el sol */
            --dark-bg: #05070a;
        }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background: url('https://images.unsplash.com/photo-1600585154340-be6161a56a0c?auto=format&fit=crop&w=1920&q=80') center/cover no-repeat fixed;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px 0;
        }

        /* Overlay para asegurar legibilidad */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }

        .container {
            width: 92%;
            max-width: 450px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 2px solid rgba(0, 210, 255, 0.3); /* Borde más marcado */
            border-radius: 20px;
            padding: 30px 20px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8);
            text-align: center;
        }

        .logo-font {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            letter-spacing: 2px;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(0,210,255,0.5);
        }

        #tenant-info {
            background: rgba(255, 204, 51, 0.1);
            border-radius: 12px;
            padding: 15px;
            margin: 20px 0;
            font-size: 1.1rem; /* Más grande */
            font-weight: 500;
            border-left: 5px solid var(--gold);
            text-align: left;
            color: #fff;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        /* AJUSTE PARA CELULAR: Inputs más grandes y legibles */
        input, select, textarea {
            width: 100%;
            background: #1a1d21; /* Fondo sólido oscuro para evitar el "borroso" */
            border: 2px solid rgba(255,255,255,0.4);
            padding: 16px; /* Más espacio para dedos grandes */
            border-radius: 12px;
            color: white;
            font-family: 'Rajdhani', sans-serif;
            font-size: 1.2rem; /* Tamaño ideal para no forzar la vista */
            font-weight: 600;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { 
            border-color: var(--accent); 
            background: #202429;
        }

        /* Placeholder con más contraste */
        ::placeholder { color: #bbb; opacity: 1; }

        .btn-glow {
            width: 100%;
            padding: 18px;
            background: linear-gradient(45deg, #00d2ff, #004e92);
            border: none;
            border-radius: 12px;
            color: white;
            font-family: 'Orbitron', sans-serif;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            box-shadow: 0 4px 15px rgba(0,210,255,0.4);
        }

        .contact-tenant {
            margin-top: 25px;
            font-size: 1.1rem;
            color: #eee;
        }

        .contact-tenant a { 
            color: var(--gold); 
            text-decoration: none; 
            font-weight: bold; 
            display: block; 
            font-size: 1.4rem; 
            margin-top: 5px;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="logo-font">Border City</div>
    <div style="font-family: 'Orbitron'; font-size: 1rem; color: white; letter-spacing: 5px;">HOMES</div>
    
    <div id="tenant-info">
        <strong id="lbl-info-head" style="color: var(--gold);">💡 Info Inquilino:</strong><br>
        <span id="json-text">...</span>
    </div>

    <form id="orderForm">
        <div class="input-group">
            <input type="text" name="Cliente" id="f-name" placeholder="NOMBRE COMPLETO" style="text-transform: capitalize;" required>
        </div>

        <div class="input-group">
            <input type="tel" id="telMask" name="Telefono" placeholder="TELÉFONO" maxlength="14" required>
        </div>

        <div class="input-group">
            <input type="email" id="emailInput" name="Email" placeholder="CORREO ELECTRÓNICO" required>
        </div>

        <div class="input-group">
            <input type="text" name="Direccion" id="f-address" placeholder="PROPIEDAD / DIRECCIÓN" required>
        </div>

        <div class="input-group">
            <select name="Servicio" id="f-service" required>
                <option value="" disabled selected id="opt-service">TIPO DE SERVICIO</option>
                <option value="HVAC">AIR CONDITIONING / HEATING</option>
                <option value="Plumbing">PLUMBING</option>
                <option value="Electric">ELECTRICAL</option>
                <option value="Appliance">APPLIANCE REPAIR</option>
            </select>
        </div>

        <textarea name="Mensaje" id="f-msg" rows="3" placeholder="DESCRIPCIÓN DEL REPORTE"></textarea>
        
        <button type="submit" id="btn-submit" class="btn-glow">DEPLOY WORK ORDER</button>
    </form>

    <div class="contact-tenant">
        <span id="lbl-emergency">Emergencias 24/7:</span>
        <a href="tel:9152828490">(915) 282-8490</a>
    </div>
</div>

<script>
    // --- LÓGICA BILINGÜE ---
    const i18n = {
        es: {
            infoHead: "💡 Info Inquilino:",
            welcome: "Bienvenido al portal de mantenimiento de Border City.",
            name: "NOMBRE COMPLETO",
            phone: "TELÉFONO (10 DÍGITOS)",
            email: "CORREO ELECTRÓNICO",
            address: "PROPIEDAD / DIRECCIÓN",
            service: "TIPO DE SERVICIO",
            msg: "DESCRIPCIÓN DEL REPORTE",
            btn: "ENVIAR ORDEN DE TRABAJO",
            btnWait: "SISTEMA ENVIANDO...",
            btnOk: "ENVÍO EXITOSO",
            emergency: "Emergencias 24/7:",
            errorMail: "Ingrese un correo válido (debe incluir @ y .com)"
        },
        en: {
            infoHead: "💡 Tenant Info:",
            welcome: "Welcome to the Border City maintenance portal.",
            name: "FULL NAME",
            phone: "PHONE NUMBER (10 DIGITS)",
            email: "EMAIL ADDRESS",
            address: "PROPERTY / ADDRESS",
            service: "SERVICE TYPE",
            msg: "REPORT DESCRIPTION",
            btn: "DEPLOY WORK ORDER",
            btnWait: "SYSTEM DEPLOYING...",
            btnOk: "SUCCESSFUL DEPLOY",
            emergency: "24/7 Emergencies:",
            errorMail: "Enter a valid email (must include @ and .com)"
        }
    };

    // Detectar idioma del teléfono
    const userLang = navigator.language || navigator.userLanguage;
    const lang = userLang.startsWith('es') ? 'es' : 'en';
    const t = i18n[lang];

    // Aplicar traducción
    document.getElementById('lbl-info-head').innerText = t.infoHead;
    document.getElementById('json-text').innerText = t.welcome;
    document.getElementById('f-name').placeholder = t.name;
    document.getElementById('telMask').placeholder = t.phone;
    document.getElementById('emailInput').placeholder = t.email;
    document.getElementById('f-address').placeholder = t.address;
    document.getElementById('opt-service').innerText = t.service;
    document.getElementById('f-msg').placeholder = t.msg;
    document.getElementById('btn-submit').innerText = t.btn;
    document.getElementById('lbl-emergency').innerText = t.emergency;

    // --- MÁSCARA DE TELÉFONO ---
    const telInput = document.getElementById('telMask');
    telInput.addEventListener('input', (e) => {
        let value = e.target.value.replace(/\D/g, ''); 
        let x = value.match(/(\d{0,3})(\d{0,3})(\d{0,4})/);
        e.target.value = !x[2] ? x[1] : '(' + x[1] + ') ' + x[2] + (x[3] ? '-' + x[3] : '');
    });

    // --- ENVÍO DE DATOS ---
    document.getElementById('orderForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btn = document.getElementById('btn-submit');
        btn.innerText = t.btnWait;
        btn.disabled = true;

        const scriptURL = 'https://script.google.com/macros/s/AKfycbxmPQHQn1Sw-If4NtWr_XadibpLWod7pRP6KOOKwJN1CWBYOMXXHaFxIHVW74N-4Sqjkw/exec';

        fetch(scriptURL, {
            method: 'POST',
            mode: 'no-cors',
            body: new FormData(this)
        })
    .then(() => {
        // Redirigir a la página de confirmación
        // Aquí podrías añadir el ID del reporte si tu script de Apps Script lo retorna
        window.location.href = 'confirmation.html'; 
        // Si Apps Script te devuelve un ID, podrías hacer:
        // window.location.href = 'confirmation.html?id=' + ID_DEL_REPORTE;
    })
    .catch(error => {
        console.error('Error!', error.message);
        alert("System Error: No se pudo conectar con el servidor.");
        btn.disabled = false;
        btn.innerText = "RETRY DEPLOY";
    });
    });
</script>

</body>
</html>
