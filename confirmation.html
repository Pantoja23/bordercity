<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title id="conf-title">Deployment Confirmed | Aldo Properties</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #00d2ff;
            --gold: #ffcc33;
            --success: #00ff88;
            --bg: #030508;
        }

        body {
            margin: 0;
            font-family: 'Rajdhani', sans-serif;
            background: radial-gradient(circle at center, #0a111a 0%, #030508 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* Overlay de red de datos */
        body::before {
            content: '';
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: -1;
        }

        .confirmation-container {
            width: 90%;
            max-width: 500px;
            background: rgba(10, 15, 20, 0.9);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(0, 210, 255, 0.2);
            border-radius: 30px;
            padding: 50px 30px;
            box-shadow: 0 0 50px rgba(0,0,0,1), 0 0 20px rgba(0, 210, 255, 0.1);
            text-align: center;
            position: relative;
            animation: slideUp 0.8s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(50px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .success-icon {
            width: 100px;
            height: 100px;
            background: rgba(0, 255, 136, 0.1);
            border: 2px solid var(--success);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 3rem;
            color: var(--success);
            text-shadow: 0 0 20px var(--success);
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.2);
            animation: pulseSuccess 2s infinite;
        }

        @keyframes pulseSuccess {
            0% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
            50% { transform: scale(1.05); box-shadow: 0 0 40px rgba(0, 255, 136, 0.4); }
            100% { transform: scale(1); box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); }
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.8rem;
            color: var(--primary);
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.5);
            margin-bottom: 20px;
            letter-spacing: 2px;
        }

        p {
            font-size: 1.1rem;
            line-height: 1.5;
            color: #b0bccb;
            margin-bottom: 30px;
        }

        .report-badge {
            display: inline-block;
            background: rgba(255, 204, 51, 0.05);
            border: 1px dashed var(--gold);
            padding: 15px 30px;
            border-radius: 15px;
            margin-bottom: 30px;
        }

        .report-id {
            display: block;
            font-family: 'Orbitron';
            font-size: 1.6rem;
            color: var(--gold);
            font-weight: bold;
            letter-spacing: 3px;
        }

        .btn-return {
            display: block;
            width: 100%;
            padding: 18px;
            background: transparent;
            border: 1px solid var(--primary);
            color: var(--primary);
            font-family: 'Orbitron';
            font-size: 0.8rem;
            text-decoration: none;
            border-radius: 12px;
            transition: 0.3s;
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: bold;
        }

        .btn-return:hover {
            background: rgba(0, 210, 255, 0.1);
            transform: translateY(-2px);
        }

        .footer-brand {
            margin-top: 40px;
            font-family: 'Orbitron';
            font-size: 0.6rem;
            color: #444;
            letter-spacing: 5px;
        }
    </style>
</head>
<body>

<div class="confirmation-container">
    <div class="success-icon">
        <i class="fas fa-check"></i>
    </div>

    <h1 id="conf-main-title">TRANSMISSION COMPLETE</h1>
    
    <p id="conf-message">
        Request successfully deployed to the field operations center. 
        A technician will be assigned shortly.
    </p>

    <div class="report-id-section" id="id-box" style="display:none;">
        <span id="conf-your-id" style="font-size: 0.7rem; color: var(--gold); font-family: 'Orbitron'; letter-spacing: 2px;">WORK ORDER ID</span>
        <span class="report-id" id="conf-report-id">#0000</span>
    </div>

    <a href="index.html" class="btn-return" id="conf-btn-back">RETURN TO HUB</a>

    <div class="footer-brand">ALDO PROPERTIES LLC</div>
</div>

<script>
    const i18n_conf = {
        es: {
            title: "Despliegue Confirmado | Aldo Properties",
            mainTitle: "TRANSMISIÓN EXITOSA",
            message: "La orden de trabajo ha sido enviada al centro de operaciones. Un técnico será asignado en breve.",
            yourId: "ID ORDEN DE TRABAJO",
            backBtn: "VOLVER AL INICIO"
        },
        en: {
            title: "Deployment Confirmed | Aldo Properties",
            mainTitle: "TRANSMISSION COMPLETE",
            message: "The work order has been deployed to the field operations center. A technician will be assigned shortly.",
            yourId: "WORK ORDER ID",
            backBtn: "RETURN TO HUB"
        }
    };

    const userLang = (navigator.language || navigator.userLanguage).startsWith('es') ? 'es' : 'en';
    const t = i18n_conf[userLang];

    document.getElementById('conf-title').innerText = t.title;
    document.getElementById('conf-main-title').innerText = t.mainTitle;
    document.getElementById('conf-message').innerText = t.message;
    document.getElementById('conf-your-id').innerText = t.yourId;
    document.getElementById('conf-btn-back').innerText = t.backBtn;

    const params = new URLSearchParams(window.location.search);
    const reportId = params.get('id');
    
    if (reportId) {
        document.getElementById('id-box').style.display = 'block';
        document.getElementById('conf-report-id').innerText = "#" + reportId;
    }
</script>

</body>
</html>
