<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Apply | Aldo Properties</title>
  
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
  
  <style>
    :root { 
      --primary: #00d2ff; 
      --accent: #ffcc33; 
      --bg: #030508; 
      --input-bg: rgba(255, 255, 255, 0.05);
    }

    * { -webkit-tap-highlight-color: transparent; box-sizing: border-box; }

    body { 
      background: var(--bg); 
      color: white; 
      font-family: 'Rajdhani', sans-serif; 
      margin: 0;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    /* Header tipo App */
    header {
      padding: 20px;
      text-align: center;
      border-bottom: 1px solid rgba(0, 210, 255, 0.2);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 10;
      background: rgba(3, 5, 8, 0.9);
    }

    h2 { font-family: 'Orbitron'; font-size: 1.2rem; margin: 0; letter-spacing: 2px; color: var(--primary); }

    .app-form {
      padding: 25px;
      flex-grow: 1;
    }

    .input-group { margin-bottom: 25px; }

    label { 
      display: block; 
      margin-bottom: 8px; 
      font-size: 0.75rem; 
      color: var(--primary); 
      font-family: 'Orbitron';
      text-transform: uppercase;
    }

    input[type="text"], input[type="email"] {
      width: 100%; 
      padding: 16px; 
      background: var(--input-bg); 
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px; 
      color: white; 
      font-size: 1rem;
      font-family: 'Rajdhani'; 
      outline: none;
      transition: 0.3s;
    }

    input:focus { border-color: var(--primary); background: rgba(0, 210, 255, 0.05); }

    /* Estilo de Botones de Carga (App Style) */
    .file-card {
      background: var(--input-bg);
      border: 2px dashed rgba(0, 210, 255, 0.3);
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      transition: 0.3s;
      cursor: pointer;
    }

    .file-card.uploaded { border-style: solid; border-color: var(--accent); background: rgba(255, 204, 51, 0.05); }

    .file-card i { font-size: 1.5rem; color: var(--primary); margin-bottom: 10px; display: block; }
    .file-card span { font-size: 0.9rem; color: #ccc; }

    /* Botón de Acción Principal Flotante o Fijo abajo */
    .footer-actions {
      padding: 20px;
      background: linear-gradient(to top, var(--bg) 80%, transparent);
      position: sticky;
      bottom: 0;
    }

    .btn-deploy {
      width: 100%; 
      padding: 20px; 
      background: var(--primary); 
      border: none; 
      border-radius: 15px;
      color: #000; 
      font-family: 'Orbitron'; 
      font-weight: 700; 
      font-size: 1rem;
      box-shadow: 0 5px 20px rgba(0, 210, 255, 0.4);
      transition: 0.2s;
    }

    .btn-deploy:active { transform: scale(0.96); opacity: 0.8; }
    
    #status-msg {
      text-align: center;
      font-size: 0.8rem;
      color: var(--accent);
      margin-top: 10px;
      font-family: 'Orbitron';
      display: none;
    }
  </style>
</head>
<body>

  <header>
    <h2>SECURE APPLICATION</h2>
  </header>

  <div class="app-form">
    <form id="rentalForm">
      <div class="input-group">
        <label>Full Name</label>
        <input type="text" name="nombre" placeholder="Enter your full name" required>
      </div>

      <div class="input-group">
        <label>Email Address</label>
        <input type="email" name="email" placeholder="email@domain.com" required>
      </div>

      <div class="input-group">
        <label>Target Property</label>
        <input type="text" name="propiedad" id="propName" readonly style="color: var(--accent); font-weight: bold;">
      </div>
      
      <div class="input-group">
        <label>Official Photo ID</label>
        <div class="file-card" id="cardId" onclick="document.getElementById('fileId').click()">
          <span id="txtId">Tap to upload ID Photo</span>
          <input type="file" id="fileId" accept="image/*" onchange="updateUI('fileId', 'cardId', 'txtId')" style="display:none;">
        </div>
      </div>

      <div class="input-group">
        <label>Proof of Income</label>
        <div class="file-card" id="cardIncome" onclick="document.getElementById('fileIncome').click()">
          <span id="txtIncome">Tap to upload Paystubs</span>
          <input type="file" id="fileIncome" accept="image/*" onchange="updateUI('fileIncome', 'cardIncome', 'txtIncome')" style="display:none;">
        </div>
      </div>
    </form>
  </div>

  <div class="footer-actions">
    <div id="status-msg">UPLOADING...</div>
    <button type="button" onclick="handleUpload()" id="btnSubmit" class="btn-deploy">SUBMIT APPLICATION</button>
  </div>

  <script>
    const BASE_URL = "https://script.google.com/macros/s/AKfycbxKFO4kgDDS4W5RP7kKqoB5kxzemX3DfOaUb5_8Tjd_-HuD3H0UTJmhRh7QH81R0XTocA/exec";

    window.onload = () => {
      const urlParams = new URLSearchParams(window.location.search);
      const house = urlParams.get('house');
      if (house) document.getElementById('propName').value = decodeURIComponent(house);
    };

    function updateUI(inputId, cardId, textId) {
      const file = document.getElementById(inputId).files[0];
      if (file) {
        document.getElementById(cardId).classList.add('uploaded');
        document.getElementById(textId).innerText = "✅ " + file.name;
      }
    }

    async function handleUpload() {
      const form = document.getElementById('rentalForm');
      const btn = document.getElementById('btnSubmit');
      const msg = document.getElementById('status-msg');
      
      const file1 = document.getElementById('fileId').files[0];
      const file2 = document.getElementById('fileIncome').files[0];

      if (!form.nombre.value || !file1 || !file2) {
        alert("Please complete all fields."); return;
      }

      btn.disabled = true;
      btn.style.display = "none";
      msg.style.display = "block";

      const getBase64 = (file) => new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result.split(',')[1]);
        reader.readAsDataURL(file);
      });

      try {
        const payload = {
          action: "submit_app",
          nombre: form.nombre.value,
          email: form.email.value,
          propiedad: document.getElementById('propName').value,
          fileIdData: await getBase64(file1),
          fileIdName: file1.name,
          fileIncomeData: await getBase64(file2),
          fileIncomeName: file2.name
        };

        fetch(BASE_URL, {
          method: "POST",
          body: JSON.stringify(payload)
        })
        .then(res => res.json())
        .then(res => {
          if (res.success) {
            msg.innerText = "SUCCESSFULLY DEPLOYED!";
            setTimeout(() => { window.location.href = "index.html"; }, 1500);
          } else {
            alert("Error: " + res.error);
            btn.disabled = false;
            btn.style.display = "block";
            msg.style.display = "none";
          }
        });
      } catch (e) {
        alert("Connection Error.");
        btn.disabled = false;
        btn.style.display = "block";
      }
    }
  </script>
</body>
</html>
